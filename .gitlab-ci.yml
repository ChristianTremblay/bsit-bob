# SERVISYS inc. Gitlab-CI Configuration file
# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/python/tags/
image: python:latest

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python3 -V # Print out python version for debugging
  - pip install virtualenv
  - python3 -m venv test_venv
  - source test_venv/bin/activate
  - pip install .
  - pip install pytest
  - pip install pyshacl
  - pip install ontoenv
  - pip install rdflib
  - pip install pyvis


test_python:
  script:
    - pytest -v tests/

generate_html:
  script:
    - rdf2html samples/ttl
    - rdf2html G36/ttl
  artifacts:
    paths:
      - samples/ttl/*.html
      - G36/ttl/*.html

validate:
  image: azul/zulu-openjdk-debian:11-jre-latest
  before_script: 
    - apt-get update -qy
    - apt-get install -y zip unzip python3 python3-pip git python3-venv
    - python3 -V # Print out python version for debugging
    - python3 -m venv validate_venv
    - source validate_venv/bin/activate
    - pip install .
    - pip install pytest
    - pip install pyshacl
    - pip install ontoenv
    - pip install rdflib
    - pip install pyvis
  script:
    - pip install requests
    - pip install pytest-xdist[psutil]
    - pip install python-dotenv
    - ontoenv init
    - git clone --branch 568-plate-heat-exchangers https://gitlab-ci-token:${CI_JOB_TOKEN}@bas-im.emcs.cornell.edu/223/223standard
    - export S223_FOLDER=$(pwd)/223standard
    - python3 validate_cicd/preparefiles.py
    - pytest -s -vvvv -n auto validate_cicd/

  artifacts:
    paths: 
      - samples/ttl/validation/**/*.*
  when: always
