# SERVISYS inc. Gitlab-CI Configuration file
# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/python/tags/
image: python:latest

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python -V # Print out python version for debugging
  - pip install virtualenv
  - virtualenv venv
  - source venv/bin/activate
  - pip install .
  - pip install pytest
  - pip install pyshacl
  - pip install ontoenv
  - pip install rdflib
  - pip install pyvis

test_python:
  script:
    - pytest

generate_html:
  script:
    - rdf2html samples/ttl
    - rdf2html G36/ttl
  artifacts:
    paths:
      - samples/ttl/*.html
      - G36/ttl/*.html

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - git clone https://github.com/TopQuadrant/shacl.git
    - cd shacl
    - docker build -f .docker/Dockerfile -t ghcr.io/topquadrant/shacl:1.4.3 --build-arg VERSION=1.4.3 --build-arg ARCH_BASE=eclipse-temurin:11-alpine .
  artifacts:
    paths:
      - shacl/.docker/Dockerfile  # Save the Dockerfile as an artifact if needed
  when: manual

validate:
  image: ghcr.io/topquadrant/shacl:1.4.3
  script:
    - git clone https://bas-im.emcs.cornell.edu/223/223standard
    - export S223_FOLDER=$(pwd)/223standard
    - python3 topbraid-validate/merge-graphs.py --no-imports --clean $S223_FOLDER/models/*.ttl $S223_FOLDER/vocab/*.ttl $S223_FOLDER/validation/*.ttl $S223_FOLDER/inference/*.ttl $S223_FOLDER/imports/qudt/VOCAB_QUDT-QUANTITY-KINDS-ALL-v2.1.ttl $S223_FOLDER/imports/qudt/VOCAB_QUDT-UNITS-ALL-v2.1.ttl 223standard.ttl
    - mv 223standard.ttl samples/validation
    - for file in samples/ttl/validation/*.ttl; do
      docker run --rm -v $(pwd)/samples/validation:/data ghcr.io/topquadrant/shacl:1.4.3 validate -datafile /data/$(basename "$file") -shapesfile /data/223standard.ttl;
      done
  artifacts:
    paths: ['samples/ttl/validation/*.ttl']
  when: manual
