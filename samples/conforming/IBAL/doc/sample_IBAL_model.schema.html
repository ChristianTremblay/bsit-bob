            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

              var filter = {
                  item : '',
                  property : '',
                  value : []

                  new TomSelect("#select-node",{
                      create: false,
                      sortField: {
                          field: "text",
                          direction: "asc"
                      }
                  });
              

              
                  // explicitly using onItemAdd and this function as we need to save multiple values
                  let updateValueFilter = function() {
                      return function () {
                      filter['value'].push(arguments[0])
                      }
                  }

                  let valueControl = new TomSelect("#select-value",{
                      maxItems: null,
                      valueField: 'id',
                      labelField: 'title',
                      searchField: 'title',
                      create: false,
                      sortField: {
                          field: "text",
                          direction: "asc"
                      },
                      onItemAdd: updateValueFilter()
                  });

                  let addValues = function() {
                      return function () {
                          // clear the current value options and add the selected attribute values
                          // tom-select handles duplicates
                          let selectedProperty = arguments[0];
                          valueControl.clear();
                          valueControl.clearOptions();
                          filter['value'] = []
                          if (filter['item'] === 'node') {
                              for (let each in allNodes) {
                                  valueControl.addOption({
                                      id:allNodes[each][selectedProperty],
                                      title:allNodes[each][selectedProperty]
                                  })
                              }
                          }
                          else if (filter['item'] === 'edge') {
                              for (let each in allEdges) {
                                  valueControl.addOption({
                                      id:allEdges[each][selectedProperty],
                                      title:allEdges[each][selectedProperty]
                                  })
                              }
                          }
                      }
                  };

                  let propControl = new TomSelect("#select-property",{
                      valueField: 'id',
                      labelField: 'title',
                      searchField: 'title',
                      create: false,
                      sortField: {
                          field: "text",
                          direction: "asc"
                      },
                      onItemAdd: addValues()
                  });

                  let addProperties = function() {
                      return function () {
                          // loops through the selected network item and adds the attributes to dropdown
                          // tom-select handles duplicates
                          clearFilter(false)
                          if (arguments[0] === 'edge') {
                              for (let each in allEdges) {
                                  if (allEdges.hasOwnProperty(each)) {
                                      for (let eachProp in allEdges[each]) {
                                          if (allEdges[each].hasOwnProperty(eachProp)) {
                                              propControl.addOption({id: eachProp, title: eachProp})
                                          }
                                      }
                                  }
                              }
                          }
                          else if (arguments[0] === 'node') {
                              for (let each in allNodes) {
                                  if (allNodes.hasOwnProperty(each)) {
                                      for (let eachProp in allNodes[each]) {
                                          if (allNodes[each].hasOwnProperty(eachProp)
                                              && (eachProp !== 'hidden' && eachProp !== 'savedLabel'
                                                  && eachProp !== 'hiddenLabel')) {
                                              propControl.addOption({id: eachProp, title: eachProp})

                                          }
                                      }
                                  }
                              }
                          }
                      }
                  };

                  let itemControl = new TomSelect("#select-item",{
                      create: false,
                      sortField:{
                          field: "text",
                          direction: "asc"
                      },
                      onItemAdd: addProperties()
                  });

                  function clearFilter(reset) {
                      // utility function to clear all the selected filter options
                      // if reset is set to true, the existing filter will be removed
                      // else, only the dropdown options are cleared
                      propControl.clear();
                      propControl.clearOptions();
                      valueControl.clear();
                      valueControl.clearOptions();
                      filter = {
                          item : '',
                          property : '',
                          value : []
                      }
                      if (reset) {
                          itemControl.clear();
                          filterHighlight({nodes: []})
                      }
                  }

                  function updateFilter(value, key) {
                      // key could be 'item' or 'property' and value is as selected in dropdown
                      filter[key] = value
                  }

rae.org/standard223/si-builder/prototype#ElectricalProportionalActuator\nNamespaces : http://www.w3.org/ns/shacl#NodeShape, rdfs\nTypes: http://www.w3.org/ns/shacl#NodeShape, rdfs:Class\n======="}, {"borderWidth": null, "group": 0, "id": "http://data.ashrae.org/standard223/si-builder#AirHandlingUnit", "label": "bob.equipment.hvac.airhandlingunit.AirHandlingUnit", "shape": "dot", "size": 15, "title": "Label : bob.equipment.hvac.airhandlingunit.AirHandlingUnit\n=======\nURI : http://data.ashrae.org/standard223/si-builder#AirHandlingUnit\nNamespaces : http://www.w3.org/ns/shacl#NodeShape, http://www.w3.org/ns/shacl#NodeShape, rdfs\nTypes: http://www.w3.org/ns/shacl#NodeShape, rdfs:Class\n=======\n\nComment : \r\n        This is treated as a system.\r\n        We will add multiple devices inside using a template\r\n\r\n        example from pritoni (2024-01-06)\r\n        ahu_template = {\r\n        \"params\": {\"label\": \"AHU\", \"comment\": \"AHU delivering air to 2 VAV boxes\"},\r\n        \"sensors\": {\r\n            (\"OA-T\", AirTemperatureSensor): {\r\n                \"hasUnit\": UNIT.DEG_C,\r\n                \"comment\": \"Oudoor air temperature (S3)\",\r\n            },\r\n            (\"TPD1\", AirDifferentialStaticPressureSensor): {\r\n                \"hasUnit\": UNIT.PA,\r\n                \"comment\": \"Filter Differential Pressure Sensor (S5)\",\r\n            },\r\n            (\"HC-T\", AirTemperatureSensor): {\r\n                \"hasUnit\": UNIT.DEG_C,\r\n                \"comment\": \"Air temperature after heating coil (S6)\",\r\n            },\r\n            (\"MA-T\", AirTemperatureSensor): {\r\n                \"hasUnit\": UNIT.DEG_F,\r\n                \"comment\": \"Return Air temperature (S4)\",\r\n            },\r\n            (\"DA-T\", AirTemperatureSensor): {\r\n                \"hasUnit\": UNIT.DEG_F,\r\n                \"comment\": \"Discharge Air temperature after cooling coil (S7)\",\r\n            },\r\n            (\"RA-T\", AirTemperatureSensor): {\r\n                \"hasUnit\": UNIT.DEG_F,\r\n                \"comment\": \"Return Air temperature (S2)\",\r\n            },\r\n            (\"TPD2\", AirDifferentialStaticPressureSensor): {\r\n                \"hasUnit\": UNIT.PA,\r\n                \"comment\": \"Supply Duct Static Pressure (S8)\",\r\n            },\r\n            (\"TPD3\", AirDifferentialStaticPressureSensor): {\r\n                \"hasUnit\": UNIT.PA,\r\n                \"comment\": \"Return Duct Static Pressure (S1)\",\r\n            },\r\n        },\r\n        \"equipment\": {\r\n            (\"RF\", Fan): {\r\n                \"comment\": \"Return Air Fan\",\r\n                \"electricalInlet\": Electricity_600VLL_3Ph_60HzInletConnectionPoint,\r\n                \"hasRole\": Role.Return,\r\n            },\r\n            (\"RF_VFD\", VFD): {\r\n                \"comment\": \"Return Air Fan VFD\",\r\n            },\r\n            (\"SF\", Fan): {\r\n                \"comment\": \"Supply Air Fan\",\r\n                \"electricalInlet\": Electricity_600VLL_3Ph_60HzInletConnectionPoint,\r\n                \"hasRole\": Role.Supply,\r\n            },\r\n            (\"SF_Starter\", MotorStarter): {\r\n                \"comment\": \"Supply Air Fan Starter\",\r\n            },\r\n            (\"CLGCOIL\", ChilledWaterCoil): {\"comment\": \"Cooling Coil\"},\r\n            (\"HTGCOIL\", HotWaterCoil): {\"comment\": \"Heating coil\"},\r\n            (\"FILTER\", Filter): {\"comment\": \"Filter\"},\r\n            (\"OADPR\", ElectricalActuatedProportionalDamper): {\r\n                \"comment\": \"Outdoor air damper (A3)\"\r\n            },\r\n            (\"MADPR\", ElectricalActuatedProportionalDamper): {\r\n                \"comment\": \"Mixed Air Damper (A2)\"\r\n            },\r\n            (\"EADPR\", ElectricalActuatedProportionalDamper): {\r\n                \"comment\": \"Exhaust Air Damper (A1)\"\r\n            },\r\n        },\r\n    }\r\n\r\n    \n=======\n======="}, {"borderWidth": null, "group": 4, "id": "http://data.ashrae.org/standard223/si-builder#Differential", "label": "bob.producer.causality.Differential", "shape": "star", "size": 15, "title": "Label : bob.producer.causality.Differential\n=======\nURI : http://data.ashrae.org/standard223/si-builder#Differential\nNamespaces : p223, http://www.w3.org/ns/shacl#NodeShape, rdfs\nTypes: http://www.w3.org/ns/shacl#NodeShape, p223:Producer, rdfs:Class\n=======\n\nComment : \r\n    This causality block goals explain that the output is the result\r\n    of substracting high input and low input.\r\n    \n=======\n======="}, {"borderWidth": null, "group": 4, "id": "http://data.ashrae.org/proposal-to-standard223#Producer", "label": "bob.producer.Producer", "shape": "star", "size": 15, "title": "Label : bob.producer.Producer\n=======\nURI : http://data.ashrae.org/proposal-to-standard223#Producer\nNamespaces : p223, rdfs\nTypes: p223:Producer, rdfs:Class\n=======\n\nComment : \r\n    Producers are black boxes representing causality.\r\n    Their inputs are causes and they produce an effect on a property\r\n    It is very similar to a function, but it is meant to show the relation\r\n    between an input and an output of something not-driven by an algorithm.\r\n    A common example would be a relay. You feed it voltage and the relay contact\r\n    is actuated.\r\n    \n=======\n======="}, {"borderWidth": null, "group": 0, "id": "http://data.ashrae.org/standard223/si-builder#WaterConnectionPoint", "label": "bob.connections.liquid.WaterConnectionPoint", "shape": "dot", "size": 15, "title": "Label : bob.connections.liquid.WaterConnectionPoint\n=======\nURI : http://data.ashrae.org/standard223/si-builder#WaterConnectionPoint\nNamespaces : http://www.w3.org/ns/shacl#NodeShape, http://www.w3.org/2000/01/rdf-schema#Class, rdfs\nTypes: http://www.w3.org/ns/shacl#NodeShape, rdfs:Class\n======="}, {"borderWidth": null, "group": 0, "id": "http://data.ashrae.org/standard223/1.0/extension/g36#Enum : http://www.w3.org/ns/shacl#NodeShape, rdfs, bacnet\nTypes: http://www.w3.org/ns/shacl#NodeShape, rdfs:Class, bacnet:Object\n======="}, {"borderWidth": null, "group": 0, "id": "http://data.ashrae.org/standard223/si-builder#CondenserConnectionPoint", "label": "bob.connections.liquid.CondenserConnectionPoint", "shape": "dot", "size": 15, "title": "Label : bob.connections.liquid.CondenserConnectionPoint\n=======\nURI : http://data.ashrae.org/standard223/si-builder#CondenserConnectionPoint\nNamespaces : http://www.w3.org/ns/shacl#NodeShape, rdfs\nTypes: http://www.w3.org/ns/shacl#NodeShape, rdfs:Class\n======="}, {"borderWidth": null, "group": 0, "id": "http://data.ashrae.org/proposal-to-standard223#Constituent-Smoke", "label": "Smoke", "shape": "dot", "size": 15, "title": "Label : Smoke\n=======\nURI : http://data.ashrae.org/proposal-to-standard223#Constituent-Smoke\nNamespaces : rdfs, http://www.w3.org/ns/shacl#NodeShape, s223, p223, http://data.ashrae.org/standard223#Constituent\nTypes: s223:Constituent, rdfs:Class, http://www.w3.org/ns/shacl#NodeShape, p223:Constituent-Smoke, s223:EnumerationKind\n======="}, {"borderWidth": null, "group": 0, "id": "http://data.ashrae.org/standard223/1.0/extension/g36#EnumerationKind-G36AlarmLevels", "label": "G36AlarmLevels", "shape": "dot", "size": 15, "title": "Label : G36AlarmLevels\n=======\nURI : http://data.ashrae.org/standard223/1.0/extension/g36#EnumerationKind-G36AlarmLevels\nNamespaces : g36, http://www.w3.org/2000/01/rdf-schema#Class, rdfs, http://www.w3.org/ns/shacl#NodeShape, s223\nTypes: http://www.w3.org/ns/shacl#NodeShape, rdfs:Class, g36:EnumerationKind-G36AlarmLevels, s223:EnumerationKind\n======="}, {"borderWidth": null, "group": 0, "id": "http://data.ashrae.org/standard223/si-builder/prototype#Fan", "label": "bob.scratch.hvac.fan.Fan", "shape": "dot", "size": 15, "title": "Label : bob.scratch.hvac.fan.Fan\n=======\nURI : http://data.ashrae.org/standard223/si-builder/prototype#Fan\nNamespaces : http://www.w3.org/ns/shacl#NodeShape, rdfs, n4dcf314f8452479d990029b5f78d50c4b85\nTypes: http://www.w3.org/ns/shacl#NodeShape, rdfs:Class, n4dcf314f8452479d990029b5f78d50c4b85\n=======\n\nComment : \r\n    Prototype of a Fan based on the Bob Fan class\r\n    Fan speed is an important property\r\n    The intrinsic property I want to make `actuatedby` a starter or a VFD, I\u0027d like it to be\r\n    a PercentCommand.\r\n    Because RPM, cfm, amps, etc... will all depend of this and I would not want having to make multiple\r\n    `actuatesProperty` relationships between the starter/vfd and the fan.\r\n    I only want 1 property.\r\n    Then if required, it\u0027ll be possible to calculate RPM, amps, cfm, etc, based on the `PercentCommand` actuated property\r\n\r\n    RPM of the fan, can be different from RPM of motor (ex. belt and pulley)\r\n    So here, speed_ratio != RPM because if a fan can deliver x RPM, the ratio of pulley can be changed and\r\n    giving 100% speed_ratio to a fan, may mean a different speed than RPM of fan.\r\n\r\n    A motor starter will give 0% or 100% of speed_ratio depending on being On or Off\r\n    A VFD will modulate this speed ratio from 0% to 100%.\r\n    Depending on the configuration of the drive, this ratio can represent 0-60Hz... or 20-50Hz\r\n    (if freq are configured different than 0-60Hz), etc...\r\n\r\n    Using speed_ratio will isolate the model from the real time data by providing an agnostic way\r\n    of actuating the fan.\r\n    \n=======\n======="}, {"borderWidth": null, "group": 0, "id": "n4dcf314f8452479d990029b5f78d50c4b85", "label": "n4dcf314f8452479d990029b5f78d50c4b85", "shape": "dot", "size": 15, "title": "Label : None\n=======\nURI : n4dcf314f8452479d990029b5f78d50c4b85\nNamespaces : http://www.w3.org/ns/shacl#PropertyShape, n4dcf314f8452479d990029b5f78d50c4b85\nTypes: http://www.w3.org/ns/shacl#PropertyShape, n4dcf314f8452479d990029b5f78d50c4b85\n======="}, {"borderWidth": null, "group": 0, "id": "http://data.ashrae.org/standard2
