<html><body>
<h1>SPARQL Query</h1>
<h2>1-how-many-lights-are-on</h2>
<pre>PREFIX s223: <http://data.ashrae.org/standard223#>

SELECT (COUNT (?d) AS ?count)
WHERE{
    ?d a s223:Luminaire .
    ?d s223:hasProperty ?prop .
    ?prop a s223:ObservableProperty .
    ?prop s223:hasExternalReference ?ref .
}
</pre>
<h1>Results</h1>
<table border='1'>
<tr><th>count</th></tr>
<tr>
<td>1</td></tr>
</table>
</body></html>
